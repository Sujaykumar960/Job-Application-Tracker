name: CareerX CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ============================================================================
  # 1. Backend Pytest Regression & Security Test Suite
  # ============================================================================
  backend-test:
    name: Backend Regression Suite
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install reportlab python-docx pypdf

      - name: Run Backend Pytest Suite
        env:
          MONGODB_URI: mongodb://localhost:27017
          MONGODB_DB_NAME: careerx_test_ci
          JWT_SECRET_KEY: ci_secret_key_testing_only_1234567890abcdef
          ENVIRONMENT: test
        run: |
          pytest backend/tests -v --durations=10

  # ============================================================================
  # 2. Frontend Strict TypeScript & Production Bundle Build
  # ============================================================================
  frontend-build:
    name: Frontend TypeScript & Vite Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Type Check & Build
        run: npm run build

  # ============================================================================
  # 3. Headless Playwright Real Browser E2E Suite
  # ============================================================================
  e2e-playwright:
    name: Playwright Browser E2E Tests
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Backend Dependencies
        run: |
          pip install -r backend/requirements.txt reportlab python-docx pypdf

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies & Playwright Browsers
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Execute Full Playwright E2E Suite
        env:
          MONGODB_URI: mongodb://localhost:27017
          MONGODB_DB_NAME: careerx_e2e_db
        run: |
          npx playwright test --reporter=list

      - name: Upload Playwright Report on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
