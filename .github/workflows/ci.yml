name: CareerX CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ============================================================================
  # 1. Backend Pytest Regression & Security Test Suite
  # ============================================================================
  backend-test:
    name: Backend Regression Suite
    runs-on: ubuntu-latest
    # The full suite completes in ~2.5 min locally. A generous ceiling still
    # fails fast instead of burning the default 6h when something hangs.
    timeout-minutes: 20
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install reportlab python-docx pypdf

      - name: Run Backend Pytest Suite
        env:
          MONGODB_URI: mongodb://localhost:27017
          MONGODB_DB_NAME: careerx_test_ci
          JWT_SECRET_KEY: ci_secret_key_testing_only_1234567890abcdef
          ENVIRONMENT: test
        run: |
          pytest backend/tests -v --durations=10

  # ============================================================================
  # 2. Frontend Strict TypeScript & Production Bundle Build
  # ============================================================================
  frontend-build:
    name: Frontend TypeScript & Vite Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Type Check & Build
        env:
          VITE_API_BASE_URL: https://api.careerx.example.com/api
        run: npm run build

  # ============================================================================
  # 3. Headless Playwright Real Browser E2E Suite
  # ============================================================================
  e2e-playwright:
    name: Playwright Browser E2E Tests
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Backend Dependencies
        run: |
          pip install -r backend/requirements.txt reportlab python-docx pypdf

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies & Playwright Browsers
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Generate E2E Env Files
        run: |
          cat > backend/.env.e2e <<'EOF'
          ENVIRONMENT=testing
          MONGODB_URI=mongodb://localhost:27017
          MONGODB_DB_NAME=careerx_e2e_db
          JWT_SECRET_KEY=careerx_ci_e2e_runtime_secret_0123456789abcdef
          CORS_ORIGINS=http://localhost:3001,http://127.0.0.1:3001
          FRONTEND_ORIGIN=http://localhost:3001
          UPLOAD_DIR=uploads_e2e
          STORAGE_BACKEND=local
          EOF
          echo "VITE_API_BASE_URL=http://localhost:8001/api" > .env.e2e
          echo "VITE_WS_BASE_URL=ws://localhost:8001/api/ws/chat" >> .env.e2e

      - name: Execute Full Playwright E2E Suite
        env:
          MONGODB_URI: mongodb://localhost:27017
          MONGODB_DB_NAME: careerx_e2e_db
        run: |
          npx playwright test --reporter=list

      - name: Upload Playwright Report on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
