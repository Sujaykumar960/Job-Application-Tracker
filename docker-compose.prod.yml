# ==============================================================================
# CareerX Production Docker Compose - API & Sandbox Server
# Architecture: Vercel (Frontend SPA) + Linux VPS (API Gateway, Backend, Sandbox, Redis)
# Database: MongoDB Atlas (Managed Cloud Cluster)
# ==============================================================================

services:
  # ============================================================================
  # 1. Redis Cache & Distributed Rate Limiter
  # ============================================================================
  redis:
    image: redis:7.2-alpine
    container_name: careerx-prod-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-lru"]
    volumes:
      - redis_data:/data
    networks:
      - careerx_internal_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ============================================================================
  # 2. FastAPI Backend Service (Gateway & Application Core)
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: careerx-prod-backend
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - ENVIRONMENT=production
      - APP_NAME=CareerX Backend API
      - HOST=0.0.0.0
      - PORT=8000
      - MONGODB_URI=${MONGODB_URI:?MONGODB_URI must be configured with your MongoDB Atlas connection string}
      - MONGODB_DB_NAME=${MONGODB_DB_NAME:-careerx_prod_db}
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in the deployment environment}
      - JWT_ALGORITHM=HS256
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - CORS_ORIGINS=${CORS_ORIGINS:-https://careerx.vercel.app,http://localhost:3000}
      - UPLOAD_DIR=/app/uploads
      - STORAGE_BACKEND=local
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - CODE_SANDBOX_URL=unix:///sandbox_ipc/sandbox.sock
      - CODE_SANDBOX_TIMEOUT_SECONDS=5.0
    volumes:
      - backend_uploads:/app/uploads
      - sandbox_ipc:/sandbox_ipc
    networks:
      - careerx_ingress_network
      - careerx_internal_network
      - careerx_egress_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ============================================================================
  # 3. Isolated Code Execution Sandbox (Zero-Network IPC via Unix Domain Socket)
  # ============================================================================
  code-sandbox:
    build:
      context: ./backend/sandbox
      dockerfile: Dockerfile
    container_name: careerx-prod-code-sandbox
    restart: unless-stopped
    network_mode: "none"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    pids_limit: 30
    mem_limit: 128m
    cpus: 0.5
    environment:
      - PYTHONUNBUFFERED=1
      - SANDBOX_SOCKET_PATH=/sandbox_ipc/sandbox.sock
      - SANDBOX_SOCKET_MODE=0660
    volumes:
      - sandbox_ipc:/sandbox_ipc
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys; sys.exit(0 if os.path.exists('/sandbox_ipc/sandbox.sock') else 1)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ============================================================================
  # 4. Nginx Edge Reverse Proxy (Ingress & SSL Termination Gateway)
  # ============================================================================
  nginx:
    image: nginx:1.27-alpine
    container_name: careerx-prod-nginx
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - careerx_ingress_network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

# ==============================================================================
# Persistent Named Volumes
# ==============================================================================
volumes:
  redis_data:
    name: careerx_prod_redis_data
  backend_uploads:
    name: careerx_prod_backend_uploads
  sandbox_ipc:
    name: careerx_prod_sandbox_ipc

# ==============================================================================
# Isolated Network Topology
# ==============================================================================
networks:
  careerx_ingress_network:
    name: careerx_prod_ingress_network
    driver: bridge

  careerx_internal_network:
    name: careerx_prod_internal_network
    driver: bridge
    internal: true

  careerx_egress_network:
    name: careerx_prod_egress_network
    driver: bridge
